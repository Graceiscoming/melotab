[package]
name = "melotab"
version = "0.1.0"
description = "MeloTab — แกะเมโลดี้เสียงร้อง → Piano Roll → Guitar Tab"
edition = "2021"

[lib]
name = "melotab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
